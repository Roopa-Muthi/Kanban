openapi: 3.0.3
info:
  title: Kanban API
  version: 1.0.0
  description: Boards, columns and cards, with JWT authentication.
paths:
  /auth/login:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /auth/me:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /auth/refresh:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /auth/register:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /boards:
    get:
      operationId: boards_list
      tags:
      - boards
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Board'
          description: ''
    post:
      operationId: boards_create
      tags:
      - boards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BoardRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BoardRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
          description: ''
  /boards/{id}:
    get:
      operationId: boards_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this board.
        required: true
      tags:
      - boards
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardDetail'
          description: ''
    patch:
      operationId: boards_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this board.
        required: true
      tags:
      - boards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBoardRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBoardRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBoardRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
          description: ''
    delete:
      operationId: boards_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this board.
        required: true
      tags:
      - boards
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /cards:
    post:
      operationId: cards_create
      tags:
      - cards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CardRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CardRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
          description: ''
  /cards/{id}:
    patch:
      operationId: cards_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this card.
        required: true
      tags:
      - cards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCardRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCardRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCardRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
          description: ''
    delete:
      operationId: cards_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this card.
        required: true
      tags:
      - cards
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /cards/{id}/move:
    post:
      operationId: cards_move_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this card.
        required: true
      tags:
      - cards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveCardRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MoveCardRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MoveCardRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
          description: ''
  /columns:
    post:
      operationId: columns_create
      tags:
      - columns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColumnRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ColumnRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ColumnRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Column'
          description: ''
  /columns/{id}:
    patch:
      operationId: columns_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this column.
        required: true
      tags:
      - columns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedColumnRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedColumnRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedColumnRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Column'
          description: ''
    delete:
      operationId: columns_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this column.
        required: true
      tags:
      - columns
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    Board:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - name
      - created_at
    BoardDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnWithCards'
          readOnly: true
      required:
      - id
      - name
      - created_at
      - columns
    BoardRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - name
    Card:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        column:
          type: integer
        title:
          type: string
          maxLength: 300
        description:
          type: string
          maxLength: 5000
        position:
          type: number
          format: double
          readOnly: true
        created_by:
          type: integer
          readOnly: true
        assignee:
          type: integer
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - column
      - title
      - description
      - position
      - created_by
      - assignee
      - due_date
      - version
      - created_at
      - updated_at
    CardRequest:
      type: object
      properties:
        column:
          type: integer
        title:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          maxLength: 5000
        assignee:
          type: integer
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
      required:
      - column
      - title
    Column:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        board:
          type: integer
        title:
          type: string
          maxLength: 200
        position:
          type: number
          format: double
          readOnly: true
      required:
      - id
      - board
      - title
      - position
    ColumnRequest:
      type: object
      properties:
        board:
          type: integer
        title:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - board
      - title
    ColumnWithCards:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        position:
          type: number
          format: double
        cards:
          type: array
          items:
            $ref: '#/components/schemas/Card'
          readOnly: true
      required:
      - id
      - title
      - position
      - cards
    MoveCardRequest:
      type: object
      properties:
        column_id:
          type: integer
        before_id:
          type: integer
          nullable: true
        after_id:
          type: integer
          nullable: true
      required:
      - column_id
    PatchedBoardRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    PatchedCardRequest:
      type: object
      properties:
        column:
          type: integer
        title:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          maxLength: 5000
        assignee:
          type: integer
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
    PatchedColumnRequest:
      type: object
      properties:
        board:
          type: integer
        title:
          type: string
          minLength: 1
          maxLength: 200
    Register:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
      required:
      - id
      - username
      - email
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
      - username
    TokenObtainPair:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenObtainPairRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
      required:
      - access
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - refresh
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
      required:
      - id
      - username
      - email
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
